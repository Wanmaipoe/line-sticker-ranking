name: Compute Day Patterns

# Once a day. Rolls the whole history into the 42 rows of day_patterns that feed the "Which day of
# the week" block on /insights. Doing it on the page render instead would be a GROUP BY over ~21k
# rows per metric every hour (~1M reads a day); this costs ~42k reads a day and the numbers are
# slow-moving ratios, so a day of staleness is invisible.
on:
  schedule:
    - cron: '40 3 * * *' # 03:40 UTC daily, after the 03:00 character classifier
  workflow_dispatch: # manual run from the Actions tab

jobs:
  day-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install @libsql/client
      - name: Recompute weekday patterns
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/compute-day-patterns.mjs
